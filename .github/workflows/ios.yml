name: iOS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build and test
        env:
          EVOLVE_DESTINATION: platform=iOS Simulator,name=iPhone 16 Pro
        run: ./Scripts/verify-release.sh
